[project]
name = "lab1"
version = "0.1.0"
description = "Warhammer 40k RAG + SQL agent lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.132.0",
    "google-genai>=2.29.0",
    "langchain-google-genai>=4.4.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "numpy>=2.5.3",
    "prompt-toolkit>=3.0.53",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "rank-bm25>=0.2.2",
    "rich>=14.0.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
eval = [  # the RAGAS evaluation only (plan §6.9): uv sync --group eval
    "langchain-community==0.4.1",  # ragas 0.4.3 imports chat_models.vertexai, removed in 0.4.2
    "ragas==0.4.3",
    "rapidfuzz>=3.14.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: needs the real PDF or its parsed output",
    "online: calls the real Gemini API; needs GOOGLE_API_KEY",
]
addopts = "-m 'not slow and not online'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
